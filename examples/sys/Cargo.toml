[package]
name = "sys"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-xbuild]
memcpy = false
sysroot_path = "target/sysroot"
panic_immediate_abort = false

[profile.dev]
panic = "abort"
opt-level = 0
lto = false

[profile.release]
panic = "abort"
opt-level = 'z'
lto = true

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
anyhow = { version = "1.0.31", default-features = false }
arrayvec = { version = "0.7.4", default-features = false }
crankstart = { path = "../.." }